<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ESI SÃO JOSÉ - PAINEL DE ATENDIMENTO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 12px; }
        header { border-bottom: 2px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .logo-header { max-height: 48px; width: auto; border-radius: 6px; background: #ffffff; padding: 3px; display: none; }
        
        h1#mainTitle { font-size: 22px; color: #3b82f6; margin: 0 0 4px 0; text-transform: uppercase; }
        #relogio { font-family: monospace; color: #60a5fa; font-weight: bold; font-size: 16px; }
        .segmento-badge { background: #3b82f6; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 12px; margin-left: 8px; font-weight: bold; text-transform: uppercase; }

        .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
        .tab-btn { padding: 10px 18px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 15px; }
        .tab-btn.active { background: #2563eb; color: white; border-color: #3b82f6; box-shadow: 0 0 10px rgba(37, 99, 235, 0.3); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 15px; align-items: start; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; height: 600px; box-sizing: border-box; }
        
        .prof-name { color: #60a5fa; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; border-bottom: 1px solid #3b82f6; padding-bottom: 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .prof-mesa-badge { font-size: 12px; color: #f59e0b; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .prof-time-badge { font-size: 11px; background: #172554; color: #60a5fa; padding: 2px 6px; border-radius: 12px; border: 1px solid #1e3a8a; text-transform: none; }

        .agenda-list { overflow-y: auto; flex-grow: 1; padding-right: 4px; scroll-behavior: smooth; }
        .agenda-list::-webkit-scrollbar { width: 6px; }
        .agenda-list::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .agenda-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .agenda-item { background: #111827; border: 1px solid #374151; padding: 12px; border-radius: 8px; margin-top: 8px; border-left: 5px solid #64748b; transition: all 0.2s; }
        .agenda-item.proximo { border-left-color: #f59e0b; background: #1e1b11; border-top: 1px solid #78350f; border-right: 1px solid #78350f; border-bottom: 1px solid #78350f; }
        .agenda-item.ativo { border-left-color: #3b82f6; background: #172554; border-top: 1px solid #1e3a8a; border-right: 1px solid #1e3a8a; border-bottom: 1px solid #1e3a8a; }
        .agenda-item.concluido { opacity: 0.4; border-left-color: #10b981; background: #022c22; }
        
        .badge-proximo { background: #f59e0b; color: #000; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; margin-left: 6px; text-transform: uppercase; }

        .timer { font-family: monospace; font-weight: bold; color: #34d399; font-size: 18px; }
        .timer.perigo { color: #f87171; animation: pisca 1s infinite; font-size: 20px; }
        @keyframes pisca { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .controls { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        button.action { font-size: 13px; padding: 8px 12px; cursor: pointer; border-radius: 5px; border: 1px solid #4b5563; background: #1f2937; color: #e5e7eb; font-weight: bold; }
        button.action:hover { background: #374151; }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <img id="mainLogoHeader" class="logo-header" src="" alt="Logo Escola">
            <div>
                <h1 id="mainTitle">FILA DE ATENDIMENTO <span id="segBadge" class="segmento-badge"></span></h1>
                <div id="relogio">00:00:00</div>
            </div>
        </div>
    </header>

    <div id="tabBar" class="tabs"></div>
    <div id="mainGrid" class="grid"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC4D3OQUebG1qK8BGeMWUsvUSSwLVv3Lsg", 
            databaseURL: "https://reuniao-fund-2-default-rtdb.firebaseio.com",
            projectId: "reuniao-fund-2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeSegment = "fund1";
        let segmentList = { "fund1": "Ensino Fundamental I", "fund2": "Ensino Fundamental II", "infantil": "Educação Infantil", "medio": "Ensino Médio" };

        let curSala = 0;
        let cloudData = { t: "FILA DE ATENDIMENTO", salas: [], series: {}, items: {}, logo: "" };
        let alarmesTocados = new Set();

        function carregarVozesSistema() {
            if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = carregarVozesSistema;
            carregarVozesSistema();
        }

        function tocarVoz(texto, enabled, rate, pitch, voiceURI) {
            if (enabled === false) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = parseFloat(rate || 0.95);
                utterance.pitch = parseFloat(pitch || 1.0);

                if (voiceURI) {
                    const vozes = window.speechSynthesis.getVoices();
                    const vozSelecionada = vozes.find(v => v.voiceURI === voiceURI || v.name === voiceURI);
                    if (vozSelecionada) utterance.voice = vozSelecionada;
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        function chamarComVozDirecta(aluno, prof, mesaProf) {
            const salaObj = (cloudData.salas && cloudData.salas[curSala]) || {};
            const audioCfg = salaObj.audioCfg || {};
            const mesaFinal = mesaProf || salaObj.n || "mesa de atendimento";
            
            let template = audioCfg.template || "Atenção: Pais do aluno {aluno}, favor dirigir-se ao professor {professor} na mesa {mesa}.";
            let mensagem = template.replace(/{aluno}/g, aluno).replace(/{professor}/g, prof).replace(/{mesa}/g, mesaFinal);
                
            tocarVoz(mensagem, audioCfg.enabled, audioCfg.rate, audioCfg.pitch, audioCfg.voiceURI);
        }

        function tocarAlarme() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.connect(gain); gain.connect(context.destination);
            osc.type = "sine"; osc.frequency.value = 880;
            gain.gain.setValueAtTime(0, context.currentTime);
            gain.gain.linearRampToValueAtTime(1, context.currentTime + 0.01);
            osc.start(context.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.5);
            osc.stop(context.currentTime + 0.5);
        }

        db.ref('sistema_v3/segmento_ativo').on('value', (snap) => {
            if (snap.val()) activeSegment = snap.val();
            conectarListenerSegmento();
        });

        db.ref('sistema_v3/segmentos_lista').on('value', (snap) => {
            if (snap.val()) segmentList = snap.val();
        });

        let currentSegmentRef = null;
        function conectarListenerSegmento() {
            if (currentSegmentRef) currentSegmentRef.off();
            currentSegmentRef = db.ref(`sistema_v3/segmentos/${activeSegment}`);
            currentSegmentRef.on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) { cloudData = val; render(); }
                else { cloudData = { t: "FILA DE ATENDIMENTO", salas: [], series: {}, items: {}, logo: "" }; render(); }
            });
        }

        function rolarFilaParaTopo(pIdx) {
            setTimeout(() => {
                const listEl = document.getElementById(`agenda-list-${pIdx}`);
                if (listEl) listEl.scrollTop = 0;
            }, 100);
        }

        function render() {
            const logoHeaderEl = document.getElementById('mainLogoHeader');
            if (cloudData.logo) {
                logoHeaderEl.src = cloudData.logo;
                logoHeaderEl.style.display = 'block';
            } else {
                logoHeaderEl.style.display = 'none';
            }

            document.getElementById('mainTitle').innerHTML = (cloudData.t || "FILA DE ATENDIMENTO") + ` <span id="segBadge" class="segmento-badge">${segmentList[activeSegment] || activeSegment}</span>`;
            
            const tabs = document.getElementById('tabBar');
            tabs.innerHTML = (cloudData.salas || []).map((s, i) => `
                <button class="tab-btn ${curSala==i?'active':''}" onclick="curSala=${i}; render()">${s.n}</button>
            `).join('');

            const grid = document.getElementById('mainGrid');
            if (!cloudData.salas || !cloudData.salas[curSala] || !cloudData.salas[curSala].p) {
                return grid.innerHTML = "<div style='padding:20px; font-weight:bold; color:#94a3b8;'>Nenhuma sala ou professor configurado neste segmento.</div>";
            }

            grid.innerHTML = cloudData.salas[curSala].p.map((profObj, pIdx) => {
                const pName = profObj.nome;
                const pMesa = profObj.mesa || cloudData.salas[curSala].n || "Mesa 01";
                const pTime = parseInt(profObj.tempoAtendimento || 10);

                let itemsProf = Object.values(cloudData.items || {}).filter(i => i.sala == curSala && i.prof == pName);
                itemsProf.sort((a,b) => a.id.localeCompare(b.id));

                const proximoItem = itemsProf.find(i => i.status === 'espera');
                const proximoId = proximoItem ? proximoItem.id : null;

                return `
                <div class="card">
                    <div>
                        <div class="prof-name">
                            <span>${pName}</span>
                            <span class="prof-time-badge">⏱️ ${pTime} min</span>
                        </div>
                        <div class="prof-mesa-badge">📍 Loc: ${pMesa}</div>
                    </div>
                    
                    <div class="agenda-list" id="agenda-list-${pIdx}">
                        ${itemsProf.length === 0 ? `
                            <div style="padding:20px; text-align:center; color:#64748b; font-size:14px; font-style:italic;">
                                Sem atendimentos agendados
                            </div>
                        ` : itemsProf.map(item => {
                            const isProximo = (item.id === proximoId);
                            return `
                            <div class="agenda-item ${item.status=='ativo'?'ativo':''} ${item.status=='fim'?'concluido':''}${isProximo ? 'proximo' : ''}">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div>
                                        <span style="font-size:13px; font-weight:bold; color:#60a5fa;">Série: ${item.serie}</span>${isProximo ? '<span class="badge-proximo">Próximo</span>' : ''}
                                    </div>
                                    <span class="timer" id="tm-${item.id}">${item.status=='fim'?'OK': (pTime.toString().padStart(2,'0') + ':00')}</span>
                                </div>
                                <div style="font-size:16px; font-weight:bold; margin-top:4px; color:#ffffff">${item.a}</div>
                                
                                <div class="controls">
                                    ${item.status=='espera' ? `
                                        <button class="action" onclick="setStatus('${item.id}', 'ativo', ${pIdx})" style="background:#2563eb; color:white; border-color:#2563eb;">Iniciar</button>
                                        <button class="action" onclick="chamarComVozDirecta('${item.a}', '${pName}', '${pMesa}')">📢 Voz</button>
                                        <button class="action" onclick="reagendarItem('${item.id}', ${pIdx})">🔄 Reagendar</button>
                                    ` : ''}
                                    ${item.status=='ativo' ? `
                                        <button class="action" onclick="setStatus('${item.id}', 'fim', ${pIdx})" style="background:#059669; color:white; border-color:#059669;">Concluir</button>
                                        <button class="action" onclick="chamarComVozDirecta('${item.a}', '${pName}', '${pMesa}')">📢 Rechamar</button>
                                    ` : ''}
                                    <button class="action" onclick="removeItem('${item.id}',${pIdx})" style="color:#f87171; border-color:#7f1d1d;">Excluir</button>
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        function setStatus(id, status, pIdx) {
            const up = { status };
            if(status === 'ativo') { 
                up.start = Date.now(); 
                alarmesTocados.delete(id);
            }
            db.ref(`sistema_v3/segmentos/${activeSegment}/items/` + id).update(up).then(() => {
                rolarFilaParaTopo(pIdx);
            });
        }

        function reagendarItem(oldId, pIdx) {
            const itemOriginal = cloudData.items[oldId];
            const novoId = Date.now().toString();
            db.ref(`sistema_v3/segmentos/${activeSegment}/items/` + oldId).remove();
            db.ref(`sistema_v3/segmentos/${activeSegment}/items/` + novoId).set({...itemOriginal, id: novoId, status: 'espera', start: 0}).then(() => {
                rolarFilaParaTopo(pIdx);
            });
        }

        function removeItem(id, pIdx) { 
            db.ref(`sistema_v3/segmentos/${activeSegment}/items/` + id).remove().then(() => {
                rolarFilaParaTopo(pIdx);
            }); 
        }

        setInterval(() => {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
            
            Object.values(cloudData.items || {}).forEach(item => {
                if(item.status === 'ativo') {
                    const el = document.getElementById('tm-' + item.id);
                    if(el) {
                        const profObj = cloudData.salas[item.sala]?.p?.find(p => p.nome === item.prof);
                        const maxMinutos = profObj ? parseInt(profObj.tempoAtendimento || 10) : parseInt(item.tempoMaxLim || 10);
                        
                        let diff = (maxMinutos * 60) - Math.floor((Date.now() - item.start) / 1000);
                        let m = Math.floor(Math.abs(diff)/60).toString().padStart(2,'0');
                        let s = (Math.abs(diff)%60).toString().padStart(2,'0');
                        
                        el.innerText = (diff < 0 ? "-" : "") + m + ":" + s;
                        
                        if(diff <= 0) { 
                            el.classList.add('perigo'); 
                            
                            if(!alarmesTocados.has(item.id)) { 
                                tocarAlarme(); 
                                const mesaProf = profObj?.mesa || cloudData.salas[item.sala]?.n || "mesa de atendimento";
                                const mensagemFim = `Atenção: O tempo de atendimento do aluno ${item.a} na ${mesaProf} encerrou.`;
                                const salaObj = cloudData.salas[item.sala] || {};
                                const audioCfg = salaObj.audioCfg || {};
                                
                                tocarVoz(mensagemFim, audioCfg.enabled, audioCfg.rate, audioCfg.pitch, audioCfg.voiceURI);
                                alarmesTocados.add(item.id); 
                            } 
                        } else {
                            el.classList.remove('perigo');
                        }
                    }
                }
            });
        }, 1000);
    </script>
</body>
</html>
